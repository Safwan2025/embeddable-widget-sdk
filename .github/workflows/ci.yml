name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish repository source
        if: ${{ hashFiles('repository.tar.gz.b64') != '' }}
        run: |
          base64 --decode repository.tar.gz.b64 > repository.tar.gz
          tar -xzf repository.tar.gz
          rm repository.tar.gz repository.tar.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish integration-ready widget SDK"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
